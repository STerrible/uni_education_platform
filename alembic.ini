[alembic]
# путь к папке с миграциями
script_location = alembic

# шаблон для имён файлов миграций
file_template = %%(rev)s_%%(slug)s

# разделитель путей
version_path_separator = os

# URL здесь не используется в рантайме: в `alembic/env.py` он всегда
# переопределяется значением из `app.core.config.Settings`.
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/database_name

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
