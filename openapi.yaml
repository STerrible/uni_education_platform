          title: Description
      type: object
      required:
      - id
      - title
      title: CourseResponse
    CourseStudentResponse:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - id
      - title
      title: CourseStudentResponse
    CourseUpdate:
      properties:
        title:
          anyOf:
