      type: object
      required:
      - question
      - options
      - correct_answer
      title: GeneratedTestQuestion
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LessonCreate:
      properties:
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        course_id:
          type: integer
          title: Course Id
        test_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Test Id
      type: object
      required:
      - title
      - content
      - course_id
      title: LessonCreate
    LessonResponse:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        course_id:
