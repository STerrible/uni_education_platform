[project]
name = "uni-edu-platform"
version = "0.1.0"
description = "Educational platform backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.25",
    "alembic==1.13.1",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.6",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "httpx==0.26.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "ruff>=0.15.13",
    "testcontainers>=4.13.2",
    "pyright>=1.1.400",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/core/deps.py" = ["B008"]
